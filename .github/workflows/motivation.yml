name: Detsu Motivation Bot

on:
  schedule:
    # Монголын цагаар 08:07, 10:07, 12:07, 14:07,
    # 16:07, 18:07, 20:07, 22:07.
    - cron: "7 8,10,12,14,16,18,20,22 * * *"
      timezone: "Asia/Ulaanbaatar"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: detsu-motivation-message
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and send motivation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          USER_NAME: Дээгий
          USER_CONTEXT: >-
            Монголд ажиллаж, суралцдаг оюутан. Программчлал, хиймэл оюун,
            сүлжээний инженерчлэл, англи хэл болон хувийн хөгжилдөө ахихыг
            хүсдэг. Олон зорилготой учраас заримдаа ядарч, эргэлзэж,
            эхлүүлсэн ажлаа хойшлуулах үе гардаг.
          TIMEZONE: Asia/Ulaanbaatar
          HISTORY_LIMIT: "16"
          MIN_MESSAGE_CHARS: "700"
          MAX_MESSAGE_CHARS: "1400"
          ALLOW_OUTSIDE_WINDOW: ${{ github.event_name == 'workflow_dispatch' }}
        run: python send_motivation.py

      - name: Save message memory
        run: |
          if git diff --quiet -- motivation_state.json; then
            echo "State өөрчлөгдөөгүй."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motivation_state.json
          git commit -m "Update motivation memory"
          git push
